apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-configmap-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-configmap-demo
  template:
    metadata:
      labels:
        app: nginx-configmap-demo
    spec:
      containers:
      - name: nginx
        image: nginx:1.27.3
        ports:
        - containerPort: 80
        volumeMounts:
        - name: config-volume
          mountPath: /usr/share/nginx/html
      volumes:
      - name: config-volume
        configMap:
          name: nginx-config
