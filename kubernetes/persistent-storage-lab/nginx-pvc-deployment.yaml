apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-pvc-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-pvc-demo
  template:
    metadata:
      labels:
        app: nginx-pvc-demo
    spec:
      containers:
      - name: nginx
        image: nginx:1.27.3
        ports:
        - containerPort: 80
        volumeMounts:
        - name: nginx-storage
          mountPath: /usr/share/nginx/html
      volumes:
      - name: nginx-storage
        persistentVolumeClaim:
          claimName: nginx-pvc
