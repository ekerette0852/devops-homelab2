name: Build Push and Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Image
        run: |
          docker build -t ekerette/github-actions-k8s-deploy-lab:v1.0.${{ github.run_number }} ./cicd/github-actions-k8s-deploy-lab/app

      - name: Push Image
        run: |
          docker push ekerette/github-actions-k8s-deploy-lab:v1.0.${{ github.run_number }}

      - name: Configure Kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" > ~/.kube/config

      - name: Update Deployment
        run: |
          kubectl set image deployment/github-actions-k8s-deploy-lab \
          web=ekerette/github-actions-k8s-deploy-lab:v1.0.${{ github.run_number }}

      - name: Verify Rollout
        run: |
          kubectl rollout status deployment/github-actions-k8s-deploy-lab
